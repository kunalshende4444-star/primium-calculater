<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">

<title>Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --background: #101114;
    --surface: #191a1f;
    --button: #292a30;
    --accent: #a68bfa;
    --text: #ffffff;
    --muted: #92939e;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.calculator {
    width: 100%;
    max-width: 370px;
    padding: 22px;
    background: var(--surface);
    border: 1px solid #292a30;
    border-radius: 28px;
    box-shadow: 0 20px 60px #0005;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.5px;
}

.badge {
    color: var(--accent);
    background: #302844;
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
}

.display {
    min-height: 135px;
    background: #111216;
    border-radius: 18px;
    margin-bottom: 20px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
}

.expression {
    width: 100%;
    text-align: right;
    color: var(--muted);
    font-size: 19px;
    overflow-wrap: anywhere;
    min-height: 25px;
}

.result {
    width: 100%;
    text-align: right;
    font-size: 43px;
    font-weight: 400;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.key {
    height: 64px;
    border: none;
    border-radius: 18px;
    background: var(--button);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    transition: transform .12s, background .12s;
    -webkit-tap-highlight-color: transparent;
}

.key:active {
    transform: scale(.94);
    background: #3b3c44;
}

.operator {
    background: #302844;
    color: var(--accent);
}

.clear {
    background: #3b2931;
    color: #ff9eae;
}

.equal {
    background: var(--accent);
    color: #171020;
    font-weight: 700;
}

.zero {
    grid-column: span 2;
}

.footer {
    text-align: center;
    color: #686975;
    margin-top: 22px;
    font-size: 11px;
}

/* MODAL */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #000b;
    backdrop-filter: blur(10px);
}

.overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 360px;
    padding: 28px 24px;
    text-align: center;
    background: #1b1c23;
    border: 1px solid #393345;
    border-radius: 24px;
    box-shadow: 0 25px 80px #0008;
    animation: appear .25s ease-out;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-icon {
    width: 68px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    border-radius: 20px;
    color: var(--accent);
    background: #302844;
    font-size: 30px;
    font-weight: 700;
}

.modal h2 {
    font-size: 25px;
    margin-bottom: 12px;
}

.modal p {
    color: #a6a6b2;
    font-size: 14px;
    line-height: 1.7;
}

.price {
    margin: 25px 0;
    padding: 20px 10px;
    border: 1px solid #35303f;
    border-radius: 16px;
    background: #15151b;
}

.price strong {
    display: block;
    font-size: 38px;
    letter-spacing: -1px;
}

.price span {
    display: block;
    color: #9393a1;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 8px;
}

.buy-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: var(--accent);
    color: #171020;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s;
}

.buy-btn:active {
    transform: scale(.97);
}

.cancel-btn {
    margin-top: 14px;
    padding: 10px;
    border: none;
    background: transparent;
    color: #9999a6;
    font-size: 14px;
    cursor: pointer;
}

.success {
    color: #80e0ae;
    background: #193629;
}

.success-title {
    color: #80e0ae;
}

.success-message {
    margin: 15px 0 24px;
}

@media (max-width: 380px) {
    .calculator {
        padding: 16px;
    }

    .key {
        height: 58px;
        border-radius: 15px;
    }

    .result {
        font-size: 36px;
    }

    .modal {
        padding: 24px 20px;
    }
}
</style>
</head>

<body>

<main class="calculator">

    <header class="header">
        <div class="logo">Calculator</div>
        <div class="badge">PREMIUM</div>
    </header>

    <section class="display">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
    </section>

    <section class="keys">

        <button class="key clear" onclick="clearAll()">AC</button>
        <button class="key operator" onclick="removeLast()">⌫</button>
        <button class="key operator" onclick="addOperator('%')">%</button>
        <button class="key operator" onclick="addOperator('/')">÷</button>

        <button class="key" onclick="addNumber('7')">7</button>
        <button class="key" onclick="addNumber('8')">8</button>
        <button class="key" onclick="addNumber('9')">9</button>
        <button class="key operator" onclick="addOperator('*')">×</button>

        <button class="key" onclick="addNumber('4')">4</button>
        <button class="key" onclick="addNumber('5')">5</button>
        <button class="key" onclick="addNumber('6')">6</button>
        <button class="key operator" onclick="addOperator('-')">−</button>

        <button class="key" onclick="addNumber('1')">1</button>
        <button class="key" onclick="addNumber('2')">2</button>
        <button class="key" onclick="addNumber('3')">3</button>
        <button class="key operator" onclick="addOperator('+')">+</button>

        <button class="key zero" onclick="addNumber('0')">0</button>
        <button class="key" onclick="addNumber('.')">.</button>
        <button class="key equal" onclick="calculate()">=</button>

    </section>

    <footer class="footer">Calculator</footer>

</main>

<!-- PREMIUM SUBSCRIPTION -->

<div class="overlay" id="premiumPopup" role="dialog"
     aria-modal="true" aria-labelledby="premiumTitle">

    <div class="modal">

        <div class="modal-icon">P</div>

        <h2 id="premiumTitle">Premium Access</h2>

        <p>
            Unlock access to your calculation results
            with a Premium subscription.
        </p>

        <div class="price">
            <strong>₹2,999</strong>
            <span>PREMIUM SUBSCRIPTION</span>
        </div>

        <button class="buy-btn" onclick="buyPremium()">
            Buy Premium
        </button>

        <button class="cancel-btn" onclick="closePopup()">
            Cancel
        </button>

    </div>
</div>

<!-- PURCHASE CONFIRMATION -->

<div class="overlay" id="successPopup" role="dialog"
     aria-modal="true" aria-labelledby="successTitle">

    <div class="modal">

        <div class="modal-icon success">✓</div>

        <h2 class="success-title" id="successTitle">
            Purchase Successful
        </h2>

        <p class="success-message">
            Your Premium access has been activated.
        </p>

        <button class="buy-btn" onclick="revealAnswer()">
            View Result
        </button>

    </div>
</div>

<script>
"use strict";

let currentInput = "";
let lastExpression = "";
let lastAnswer = null;

const expressionDisplay = document.getElementById("expression");
const resultDisplay = document.getElementById("result");
const premiumPopup = document.getElementById("premiumPopup");
const successPopup = document.getElementById("successPopup");

function formatExpression(value) {
    return value.replace(/\*/g, "×").replace(/\//g, "÷");
}

function updateDisplay() {
    expressionDisplay.textContent =
        formatExpression(currentInput) || "0";

    resultDisplay.textContent = currentInput ? "" : "0";
}

function addNumber(number) {
    if (currentInput.length >= 24) return;

    // Prevent multiple decimal points in one number.
    if (number === ".") {
        const currentNumber = currentInput.split(/[+\-*/%]/).pop();

        if (currentNumber.includes(".")) return;
    }

    currentInput += number;
    updateDisplay();
}

function addOperator(operator) {
    if (!currentInput) return;

    const lastChar = currentInput.slice(-1);

    if ("+-*/%".includes(lastChar)) {
        currentInput = currentInput.slice(0, -1);
    }

    currentInput += operator;
    updateDisplay();
}

function clearAll() {
    currentInput = "";
    lastExpression = "";
    lastAnswer = null;

    expressionDisplay.textContent = "0";
    resultDisplay.textContent = "0";

    premiumPopup.classList.remove("show");
    successPopup.classList.remove("show");
}

function removeLast() {
    currentInput = currentInput.slice(0, -1);
    updateDisplay();
}

// Evaluate basic arithmetic without accepting arbitrary JavaScript.
function evaluateExpression(expression) {
    if (!/^[0-9+\-*/%.()\s]+$/.test(expression)) {
        throw new Error("Invalid expression");
    }

    const normalized = expression.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");

    if (/\/\s*0(?:\.0*)?(?![\d.])/.test(normalized)) {
        throw new Error("Division by zero");
    }

    const value = Function(
        '"use strict"; return (' + normalized + ')'
    )();

    if (typeof value !== "number" || !Number.isFinite(value)) {
        throw new Error("Invalid result");
    }

    return value;
}

function calculate() {
    if (!currentInput) return;

    try {
        lastAnswer = evaluateExpression(currentInput);
        lastExpression = currentInput;

        premiumPopup.classList.add("show");
    } catch (error) {
        expressionDisplay.textContent = "Invalid calculation";
        resultDisplay.textContent = "Error";
    }
}

function closePopup() {
    premiumPopup.classList.remove("show");
}

// Demo only: no payment is processed.
function buyPremium() {
    premiumPopup.classList.remove("show");
    successPopup.classList.add("show");
}

// Intentionally display an incorrect result for the demo.
function revealAnswer() {
    successPopup.classList.remove("show");

    const normalized = lastExpression.replace(/\s/g, "");
    let wrongAnswer;

    if (normalized === "2+2") {
        wrongAnswer = 3;
    } else if (normalized === "1+1") {
        wrongAnswer = 3;
    } else if (normalized === "10-5") {
        wrongAnswer = 4;
    } else if (lastAnswer === 0) {
        wrongAnswer = 1;
    } else {
        wrongAnswer = lastAnswer + 1;
    }

    expressionDisplay.textContent = formatExpression(lastExpression);

    resultDisplay.textContent = Number.isInteger(wrongAnswer)
        ? String(wrongAnswer)
        : String(Number(wrongAnswer.toFixed(6)));
}

// Close the Premium dialog when tapping outside it.
premiumPopup.addEventListener("click", function(event) {
    if (event.target === premiumPopup) {
        closePopup();
    }
});

// Keyboard controls.
document.addEventListener("keydown", function(event) {
    if (/^[0-9.]$/.test(event.key)) {
        addNumber(event.key);
    } else if ("+-*/%".includes(event.key)) {
        addOperator(event.key);
    } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
    } else if (event.key === "Backspace") {
        removeLast();
    } else if (event.key === "Escape") {
        closePopup();
        successPopup.classList.remove("show");
    }
});
</script>

</body>
  </html>
